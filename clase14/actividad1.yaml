>> Impacto en el tiempo de ejecución:

Aumentar N de 6 a 8 incrementa exponencialmente el número de combinaciones a probar.
Para N=8, hay 4.4 × 10^7 posibles configuraciones, pero el backtracking reduce drásticamente la cantidad de intentos al evitar soluciones inválidas.

7️. ¿Por qué el método isSafe es crucial en este algoritmo?
  - isSafe(board, row, col) filtra posiciones inválidas antes de colocar una reina.
  - Sin esta verificación, el algoritmo probaría todas las combinaciones posibles (O(N^N)), en lugar de solo las prometedoras.
  - Reduce el tiempo de ejecución al evitar caminos sin solución.

>> Funciones clave de isSafe:
Evita conflictos en la misma columna.
Evita ataques en diagonales.
Permite que el backtracking explore solo opciones válidas.